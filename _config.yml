# The brand alone. jekyll-seo-tag appends this to each page's own title, so a
# page titled "Support" renders as "Support | ConjuGo".
title: "ConjuGo"
tagline: "Master French Verb Conjugation in 5 Minutes a Day"
description: "iOS app for French verb conjugation. 6,000+ verbs, the five tenses of everyday French, smart spaced-repetition drills. Free 7-day trial."
url: "https://conjugo.me"
baseurl: ""
encoding: utf-8

# Internal notes — not part of the published site.
exclude:
  - docs
  - README.md
  - Gemfile
  - Gemfile.lock

# The App Store listing — the one place this lives, so the hero CTA, the badge
# and the iOS smart banner can never drift apart. The URL is deliberately
# storefront-agnostic: Apple redirects each visitor to their own storefront.
app_store_id: "6757608840"
app_store_url: "https://apps.apple.com/app/id6757608840"

# GA4 web data stream. Leave empty and NOTHING is emitted — no tag, no consent
# banner, no cookies. Paste the "G-XXXXXXXXXX" measurement ID from
# Analytics → Admin → Data streams → Web to switch measurement on.
# Setup and the console-side steps: docs/analytics-setup.md
ga4_measurement_id: "G-6VLC6PKP9Q"

# Both are on GitHub Pages' allowed-plugins list, so they run on the live build
# with no Actions workflow. seo-tag writes titles, canonicals, Open Graph and
# WebSite JSON-LD; sitemap generates /sitemap.xml from the pages themselves.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

author: "Alojz Kovacik"
logo: /assets/img/app-icon.png

# seo-tag reads og:image from the page, so give every page the same default.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/app-icon.png

# Paste the token from Search Console's "HTML tag" verification method, minus
# the markup — just the content value. Leave empty to emit nothing.
google_site_verification: "dqQTPvkJcwKF13xwcy5ut2rPh7w4Ze8d9mOiKOtBukI"
