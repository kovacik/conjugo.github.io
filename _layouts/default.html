<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Title, description, canonical, Open Graph, Twitter card and WebSite
       JSON-LD all come from jekyll-seo-tag. Don't hand-write any of them
       alongside it — duplicated og: tags are worse than none. -->
  {% seo %}

  <!-- Safari on iOS turns this into a native "Open in App Store" banner -->
  <meta name="apple-itunes-app" content="app-id={{ site.app_store_id }}">

  <!-- favicon.ico and apple-touch-icon.png also live at the site root because
       browsers and iOS request those exact paths whether or not they are linked. -->
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" href="{{ '/assets/img/favicon.png' | relative_url }}" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">

  {% include analytics.html %}
  {% include app-schema.html %}
</head>
<body>

  {% include header.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}
  {% include consent-banner.html %}

</body>
</html>
